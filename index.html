<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SANAD MAAMOUR | Property Advisory</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/css/intlTelInput.css">
<style>
  :root{--navy:#0B1F3B;--gold:#C8A24A;}
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;margin:0;padding:16px;color:#1F2328}
  .card{max-width:560px;margin:0 auto;background:#fff;border-radius:16px;padding:22px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
  .brand{text-align:center;border-bottom:2px solid var(--gold);padding-bottom:12px;margin-bottom:8px}
  .brand h1{margin:0;font-size:22px;letter-spacing:2px;color:var(--navy)}
  .brand small{color:#6b7280}
  label{display:block;margin-top:14px;font-weight:700;font-size:14px}
  select,input[type=text],input[type=tel]{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px;font-size:16px;background:#fff}
  .iti{width:100%}
  .iti input{direction:ltr;text-align:left}
  button{margin-top:22px;width:100%;padding:15px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
  button:disabled{background:#9ca3af}
  .note{display:block;color:#6b7280;font-size:12px;margin-top:12px;text-align:center;line-height:1.6}
  #fallback{display:none;text-align:center;margin-top:14px}
  #fallback a{color:var(--navy);font-weight:700}
  .opt{color:#9ca3af;font-weight:400}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <h1>SANAD MAAMOUR</h1>
    <small id="tag"></small>
  </div>

  <form id="leadForm" novalidate>
    <label id="nameLbl"></label>
    <input id="name" type="text" autocomplete="name">

    <label id="phoneLbl"></label>
    <input id="phone" type="tel" autocomplete="tel">

    <div id="fields"></div>

    <button type="submit" id="btn"></button>
    <span class="note" id="note"></span>
    <div id="fallback"><a id="fallbackLink" href="#"></a></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/js/intlTelInput.min.js"></script>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsNFSyLvL0o3nzKpVn-gstT2y2efSBBr2EesnOerzQIlf0ULpvee9NaT1Pjwjyw-az/exec";
const WA = { eg: "201034613266", uae: "971528534779" };

const params = new URLSearchParams(location.search);
const market = (params.get('market') || 'eg').toLowerCase() === 'uae' ? 'uae' : 'eg';
const lang   = (params.get('lang')   || 'en').toLowerCase() === 'ar'  ? 'ar'  : 'en';
const T = (en, ar) => lang === 'ar' ? ar : en;

const d = new Date();
const autoCampaign = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const utm = {
  source:   (params.get('utm_source')   || 'direct').toLowerCase(),
  medium:   (params.get('utm_medium')   || 'none').toLowerCase(),
  campaign: (params.get('utm_campaign') || autoCampaign).toLowerCase(),
  content:  (params.get('utm_content')  || '').toLowerCase()
};

if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }

// ---------- Options: [value(English, saved in sheet), Arabic label] ----------
const AREAS_EG = [
  ["New October","أكتوبر الجديدة"],["Luxor","الأقصر"],["Alexandria","الإسكندرية"],
  ["Red Sea","البحر الأحمر"],["Sixth Settlement","التجمع السادس"],["Giza","الجيزة"],
  ["Hadayek October","حدائق أكتوبر"],["Ras Sedr","رأس سدر"],["Zahraa El Maadi","زهراء المعادي"],
  ["6th of October","السادس من أكتوبر"],["North Coast","الساحل الشمالي"],["Al Shorouk","الشروق"],
  ["Sheikh Zayed","الشيخ زايد"],["New Sheikh Zayed","الشيخ زايد الجديدة"],
  ["New Capital","العاصمة الإدارية"],["Obour","العبور"],["New Obour","العبور الجديدة"],
  ["New Alamein","العلمين الجديدة"],["Ain Sokhna","العين السخنة"],["New Cairo","القاهرة الجديدة"],
  ["Badr City","مدينة بدر"],["Nasr City","مدينة نصر"],["Mostakbal City","مستقبل سيتي"],
  ["Heliopolis","مصر الجديدة"],["Old Cairo","مصر القديمة"],["Maadi","المعادي"],
  ["Mokattam","المقطم"],["New Mansoura","المنصورة الجديدة"],["New Heliopolis","هليوبوليس الجديدة"]
];
const OTHER_AREA = ["Other / Not sure","أخرى / غير محدد"];
let areaOpts = AREAS_EG.slice();
if (lang === 'en') areaOpts.sort((a, b) => a[0].localeCompare(b[0]));
areaOpts.push(OTHER_AREA);

const FIELDS = (market === 'uae') ? [
  { id:'budget', en:'Budget (AED)', ar:'الميزانية (درهم)', opts:[
    ["< 500K","أقل من 500 ألف"],["500K - 1M","من 500 ألف إلى مليون"],
    ["1M - 2M","من مليون إلى 2 مليون"],["2M - 3M","من 2 إلى 3 مليون"]] },
  { id:'area', en:'Emirate', ar:'الإمارة', opts:[
    ["Dubai","دبي"],["Abu Dhabi","أبوظبي"],["Any emirate","أي إمارة"]] },
  { id:'unit', en:'Unit type', ar:'نوع الوحدة', opts:[
    ["Studio","ستوديو"],["Apartment","شقة"],["Villa","فيلا"]] },
  { id:'purpose', en:'Purpose', ar:'الغرض', opts:[
    ["Investment only","استثمار فقط"],["Investment + residency","استثمار + إقامة"],
    ["Relocation / living","للانتقال والسكن"]] },
  { id:'source', en:'Purchase timeline', ar:'موعد الشراء', opts:[
    ["0-3 months","من 0 إلى 3 شهور"],["3-6 months","من 3 إلى 6 شهور"],["6-12 months","من 6 إلى 12 شهر"]] },
  { id:'dp', en:'Down payment', ar:'المقدم', opts:[
    ["Cash","كاش"],["10%","10%"],["20%","20%"],["30%","30%"],
    ["40% or more","40% أو أكثر"],["Not sure","غير محدد"]] },
  { id:'dpAmount', en:'Down payment amount (AED)', ar:'مبلغ المقدم (درهم)', type:'text', optional:true },
] : [
  { id:'budget', en:'Budget (EGP)', ar:'الميزانية (جنيه)', opts:[
    ["1M - 2M","من 1 إلى 2 مليون"],["2M - 5M","من 2 إلى 5 مليون"],
    ["5M - 10M","من 5 إلى 10 مليون"],["10M - 25M","من 10 إلى 25 مليون"],
    ["25M+","أكثر من 25 مليون"]] },
  { id:'area', en:'Area', ar:'المنطقة', opts: areaOpts },
  { id:'unit', en:'Unit type', ar:'نوع الوحدة', opts:[
    ["Residential","سكني"],["Commercial","تجاري"],["Administrative (Office)","إداري"],["Chalet","شاليه"]] },
  { id:'purpose', en:'Property source', ar:'مصدر الوحدة', opts:[
    ["New from developer","جديد من المطور"],["Resale (from owner)","إعادة بيع (من مالك)"],
    ["Either / Not sure","لا يفرق / غير محدد"]] },
  { id:'source', en:'Delivery', ar:'الاستلام', opts:[
    ["Ready (immediate)","استلام فوري"],["Within 1 year","خلال سنة"],
    ["1 - 3 years","من 1 إلى 3 سنوات"],["3+ years","أكثر من 3 سنوات"],["Not sure","غير محدد"]] },
  { id:'dp', en:'Down payment', ar:'المقدم', opts:[
    ["Cash","كاش"],["10%","10%"],["15%","15%"],["20%","20%"],["25%","25%"],
    ["30% or more","30% أو أكثر"],["Not sure","غير محدد"]] },
  { id:'dpAmount', en:'Down payment amount (EGP)', ar:'مبلغ المقدم (جنيه)', type:'text', optional:true },
  { id:'install', en:'Max monthly installment (EGP)', ar:'أقصى قسط شهري (جنيه)', type:'text', optional:true },
];

// ---------- Texts ----------
document.getElementById('tag').textContent = T('Property Advisory | Egypt • UAE','استشارات عقارية | مصر • الإمارات');
document.getElementById('nameLbl').textContent = T('Name','الاسم');
document.getElementById('phoneLbl').textContent = T('WhatsApp number','رقم الواتساب');
document.getElementById('btn').textContent = T('Continue to WhatsApp','متابعة إلى واتساب');
document.getElementById('note').textContent = T(
  'By continuing you agree to be contacted about your request. WhatsApp will open with a ready message — tap Send.',
  'بالمتابعة توافق على التواصل معك بخصوص طلبك. سيفتح واتساب برسالة جاهزة، اضغط إرسال.');

// ---------- Build fields ----------
const box = document.getElementById('fields');
FIELDS.forEach(f => {
  const label = document.createElement('label');
  label.innerHTML = T(f.en, f.ar) + (f.optional ? ' <span class="opt">' + T('(optional)', '(اختياري)') + '</span>' : '');
  box.appendChild(label);
  let el;
  if (f.type === 'text') {
    el = document.createElement('input'); el.type = 'text';
  } else {
    el = document.createElement('select');
    const ph = document.createElement('option'); ph.value = ''; ph.textContent = T('Select…', 'اختر…'); el.appendChild(ph);
    f.opts.forEach(o => {
      const op = document.createElement('option');
      op.value = o[0]; op.textContent = T(o[0], o[1]); el.appendChild(op);
    });
  }
  el.id = f.id;
  box.appendChild(el);
});

// ---------- Phone with all country codes ----------
const phoneEl = document.getElementById('phone');
const iti = window.intlTelInput(phoneEl, {
  initialCountry: market === 'uae' ? 'ae' : 'eg',
  separateDialCode: true,
  preferredCountries: ['eg','ae','sa','kw','qa','om','bh','jo','us','gb'],
  utilsScript: 'https://cdn.jsdelivr.net/npm/intl-tel-input@19.5.6/build/js/utils.js'
});

// ---------- Submit ----------
let sending = false;
document.getElementById('leadForm').addEventListener('submit', function (e) {
  e.preventDefault();
  if (sending) return;

  // validation
  const digits = phoneEl.value.replace(/\D/g, '');
  if (digits.length < 6) { alert(T('Please enter your WhatsApp number.', 'من فضلك اكتب رقم الواتساب.')); return; }
  for (const f of FIELDS) {
    if (!f.optional && !document.getElementById(f.id).value) {
      alert(T('Please complete: ', 'من فضلك أكمل: ') + T(f.en, f.ar));
      document.getElementById(f.id).focus();
      return;
    }
  }

  sending = true;
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = T('Sending…', 'جاري الإرسال…');

  const name = document.getElementById('name').value.trim();
  const phone = iti.getNumber() || ('+' + digits);
  const v = id => (document.getElementById(id) ? document.getElementById(id).value.trim() : '');

  // human-readable label of a select in current language
  const shown = id => {
    const el = document.getElementById(id);
    return el && el.tagName === 'SELECT' && el.selectedIndex > 0 ? el.options[el.selectedIndex].textContent : v(id);
  };

  const dpFull = v('dp') + (v('dpAmount') ? ' | ' + v('dpAmount') : '');

  // WhatsApp message (client sends it from his own phone)
  const lines = [];
  lines.push(T('Hello SANAD MAAMOUR, I would like property advice. My details:',
               'مرحبًا سند معمور، أرغب في استشارة عقارية. بياناتي:'));
  lines.push(T('Market: ', 'السوق: ') + (market === 'uae' ? T('UAE', 'الإمارات') : T('Egypt', 'مصر')));
  FIELDS.forEach(f => {
    const val = shown(f.id);
    if (val) lines.push(T(f.en, f.ar) + ': ' + val);
  });
  if (name) lines.push(T('Name: ', 'الاسم: ') + name);
  lines.push(T('Phone: ', 'الهاتف: ') + phone);
  const msg = lines.join('\n');
  const waLink = 'https://wa.me/' + WA[market] + '?text=' + encodeURIComponent(msg);

  // payload for Google Sheet (English values for clean analysis)
  const payload = {
    market: market, lang: lang, name: name, phone: phone,
    budget: v('budget'), area: v('area'), unit: v('unit'),
    purpose: v('purpose'), source: v('source'),
    dp: dpFull, install: v('install'),
    utm_source: utm.source, utm_medium: utm.medium,
    utm_campaign: utm.campaign, utm_content: utm.content,
    landing: location.href, waMsg: msg
  };

  const send = fetch(SCRIPT_URL, {
    method: 'POST', mode: 'no-cors', keepalive: true,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).catch(() => {});
  const maxWait = new Promise(r => setTimeout(r, 2500));

  Promise.race([send, maxWait]).then(() => {
    const fb = document.getElementById('fallback');
    document.getElementById('fallbackLink').href = waLink;
    document.getElementById('fallbackLink').textContent =
      T('If WhatsApp did not open, tap here', 'لو واتساب لم يفتح، اضغط هنا');
    fb.style.display = 'block';
    btn.textContent = T('Opening WhatsApp…', 'جاري فتح واتساب…');
    window.location.href = waLink;
  });
});
</script>
</body>
</html>
